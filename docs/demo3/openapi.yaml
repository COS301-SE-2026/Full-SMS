components:
  schemas:
    ApprovePluginRequest:
      properties:
        feedback:
          anyOf:
            - type: string
              minLength: 10
            - type: 'null'
          title: Feedback
      type: object
      title: ApprovePluginRequest
    Body_read_api_py_hdf5_read_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
        - file
      title: Body_read_api_py_hdf5_read_post
    Body_upload_file_api_py_upload__post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
        - file
      title: Body_upload_file_api_py_upload__post
    ClusteringReq:
      properties:
        levels:
          items:
            $ref: '#/components/schemas/LevelData'
          type: array
          title: Levels
      type: object
      required:
        - levels
      title: ClusteringReq
    CpaReq:
      properties:
        upload_id:
          type: string
          title: Upload Id
        measurement_id:
          type: string
          title: Measurement Id
        confidence:
          type: integer
          title: Confidence
      type: object
      required:
        - upload_id
        - measurement_id
        - confidence
      title: CpaReq
    ExportFormat:
      type: string
      enum:
        - csv
        - parquet
        - xlsx
        - json
      title: ExportFormat
      description: Supported export formats.
    ExportRequest:
      properties:
        upload_id:
          type: string
          title: Upload Id
        selections:
          items:
            $ref: '#/components/schemas/Selection'
          type: array
          title: Selections
        export_levels:
          type: boolean
          title: Export Levels
          default: false
        export_groups:
          type: boolean
          title: Export Groups
          default: false
        export_intensity:
          type: boolean
          title: Export Intensity
          default: false
        format:
          $ref: '#/components/schemas/ExportFormat'
          default: csv
        bin_size_ms:
          type: number
          title: Bin Size Ms
          default: 10
        plot_format:
          $ref: '#/components/schemas/PlotFormat'
          default: pdf
        plot_dpi:
          type: integer
          title: Plot Dpi
          default: 150
        plot_intensity:
          type: boolean
          title: Plot Intensity
          default: false
        plotIntensity_levels:
          type: boolean
          title: Plotintensity Levels
          default: false
        plotIntensity_groups:
          type: boolean
          title: Plotintensity Groups
          default: false
        plot_bic:
          type: boolean
          title: Plot Bic
          default: false
        use_roi:
          type: boolean
          title: Use Roi
          default: false
      type: object
      required:
        - upload_id
        - selections
      title: ExportRequest
    FitSettings:
      properties:
        use_moving_avg:
          type: boolean
          title: Use Moving Avg
          default: true
        moving_avg_window:
          type: integer
          title: Moving Avg Window
          default: 10
        start_percent:
          type: number
          title: Start Percent
          default: 80
        end_multiple:
          type: number
          title: End Multiple
          default: 20
        end_percent:
          type: number
          title: End Percent
          default: 1
        minimum_decay_window_ns:
          type: number
          title: Minimum Decay Window Ns
          default: 2
        bg_percent:
          type: number
          title: Bg Percent
          default: 5
      type: object
      title: FitSettings
      description: |-
        Configuration settings for lifetime fitting.

        Attributes:
            use_moving_avg: Whether to use moving average smoothing for boundary detection.
            moving_avg_window: Window size for moving average in channels.
            start_percent: Percentage of max for automatic start detection.
            end_multiple: Multiple of background for automatic end detection.
            end_percent: Percentage of max for automatic end detection.
            minimum_decay_window_ns: Minimum decay window in nanoseconds.
            bg_percent: Maximum background as percentage of max.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IntensityReq:
      properties:
        upload_id:
          type: string
          title: Upload Id
        measurement_id:
          type: string
          title: Measurement Id
        bin_size_ms:
          type: number
          title: Bin Size Ms
      type: object
      required:
        - upload_id
        - measurement_id
        - bin_size_ms
      title: IntensityReq
    IntensityRes:
      properties:
        time_bins:
          items:
            type: number
          type: array
          title: Time Bins
        counts:
          items:
            type: integer
          type: array
          title: Counts
        intensity_cps:
          items:
            type: number
          type: array
          title: Intensity Cps
      type: object
      required:
        - time_bins
        - counts
        - intensity_cps
      title: IntensityRes
    LevelData:
      properties:
        start_index:
          type: integer
          title: Start Index
        end_index:
          type: integer
          title: End Index
        start_time_ns:
          type: integer
          title: Start Time Ns
        end_time_ns:
          type: integer
          title: End Time Ns
        num_photons:
          type: integer
          title: Num Photons
        intensity_cps:
          type: number
          title: Intensity Cps
        group_id:
          anyOf:
            - type: integer
            - type: 'null'
          title: Group Id
      type: object
      required:
        - start_index
        - end_index
        - start_time_ns
        - end_time_ns
        - num_photons
        - intensity_cps
      title: LevelData
      description: |-
        A single intensity level detected by change point analysis.

        A level represents a period of constant intensity within a measurement's
        photon trace. Levels are the output of change point analysis (CPA).

        Attributes:
            start_index: First photon index (inclusive) in this level.
            end_index: Last photon index (inclusive) in this level.
            start_time_ns: Absolute time of the first photon in nanoseconds.
            end_time_ns: Absolute time of the last photon in nanoseconds.
            num_photons: Number of photons in this level.
            intensity_cps: Intensity in counts per second.
            group_id: Optional group assignment from clustering.
    LifetimePayload:
      properties:
        upload_id:
          type: string
          title: Upload Id
        measurement_id:
          type: string
          title: Measurement Id
        bin_size_ms:
          type: number
          title: Bin Size Ms
      type: object
      required:
        - upload_id
        - measurement_id
        - bin_size_ms
      title: LifetimePayload
    LifetimeReq:
      properties:
        upload_id:
          type: string
          title: Upload Id
        measurement_id:
          type: string
          title: Measurement Id
        times:
          items:
            type: number
          type: array
          title: Times
        counts:
          items:
            type: integer
          type: array
          title: Counts
        channelwidth:
          anyOf:
            - type: number
            - type: 'null'
          title: Channelwidth
        irf:
          anyOf:
            - items:
                type: number
              type: array
            - type: 'null'
          title: Irf
        num_exponentials:
          type: integer
          title: Num Exponentials
          default: 1
        tau_init:
          anyOf:
            - type: number
            - items:
                type: number
              type: array
            - type: 'null'
          title: Tau Init
        tau_bounds:
          anyOf:
            - prefixItems:
                - type: number
                - type: number
              type: array
              maxItems: 2
              minItems: 2
            - type: 'null'
          title: Tau Bounds
        amp_init:
          anyOf:
            - items:
                type: number
              type: array
            - type: 'null'
          title: Amp Init
        amp_bounds:
          anyOf:
            - prefixItems:
                - type: number
                - type: number
              type: array
              maxItems: 2
              minItems: 2
            - type: 'null'
          title: Amp Bounds
        shift_init:
          type: number
          title: Shift Init
          default: 0
        shift_bounds:
          anyOf:
            - prefixItems:
                - type: number
                - type: number
              type: array
              maxItems: 2
              minItems: 2
            - type: 'null'
          title: Shift Bounds
        start:
          anyOf:
            - type: integer
            - type: 'null'
          title: Start
        end:
          anyOf:
            - type: integer
            - type: 'null'
          title: End
        autostart:
          $ref: '#/components/schemas/StartpointMode'
          default: Manual
        autoend:
          type: boolean
          title: Autoend
          default: false
        background:
          anyOf:
            - type: number
            - type: 'null'
          title: Background
        irf_background:
          anyOf:
            - type: number
            - type: 'null'
          title: Irf Background
        settings:
          anyOf:
            - $ref: '#/components/schemas/FitSettings'
            - type: 'null'
        fit_irf_fwhm:
          type: boolean
          title: Fit Irf Fwhm
          default: false
        irf_fwhm_init:
          anyOf:
            - type: number
            - type: 'null'
          title: Irf Fwhm Init
        irf_fwhm_bounds:
          anyOf:
            - prefixItems:
                - type: number
                - type: number
              type: array
              maxItems: 2
              minItems: 2
            - type: 'null'
          title: Irf Fwhm Bounds
      type: object
      required:
        - upload_id
        - measurement_id
        - times
        - counts
      title: LifetimeReq
    MeasurementData:
      properties:
        microtimes:
          items:
            type: number
          type: array
          title: Microtimes
        abstimes:
          items:
            type: number
          type: array
          title: Abstimes
        channel:
          anyOf:
            - type: integer
            - type: 'null'
          title: Channel
        metadata:
          anyOf:
            - additionalProperties: true
