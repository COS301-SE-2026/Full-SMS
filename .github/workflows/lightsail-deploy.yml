name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
      - chore/aws-cd
      - develop
      - bugfix/aws-workflow
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.0
        env:
          BRANCH: ${{ github.ref_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET_KEY: ${{ secrets.SUPABASE_JWT_SECRET_KEY }}
          SUPABASE_JWK: ${{ secrets.SUPABASE_JWK }}
          SUPABASE_BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET_NAME }}
          BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
          EXECUTION_URL: ${{ secrets.EXECUTION_URL }}
          EXECUTION_API_KEY: ${{ secrets.EXECUTION_API_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          ONEDRIVE_REDIRECT_URI: ${{ secrets.ONEDRIVE_REDIRECT_URI }}
          NEXT_PUBLIC_MS_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_MS_CLIENT_ID }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          envs: BRANCH,SUPABASE_URL,SUPABASE_SERVICE_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_JWT_SECRET_KEY,SUPABASE_JWK,SUPABASE_BUCKET_NAME,BACKEND_CORS_ORIGINS,EXECUTION_URL,EXECUTION_API_KEY,ONEDRIVE_CLIENT_ID,ONEDRIVE_CLIENT_SECRET,ONEDRIVE_REDIRECT_URI,NEXT_PUBLIC_MS_CLIENT_ID
          script_stop: true
          script: |
            echo "Starting deployment for branch: $BRANCH"

            cd ~/Full-SMS

            echo "Creating backend .env file"
            cat > .env << EOF
            SUPABASE_URL=${SUPABASE_URL}
            SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            SUPABASE_JWT_SECRET_KEY=${SUPABASE_JWT_SECRET_KEY}
            SUPABASE_JWK=${SUPABASE_JWK}
            SUPABASE_BUCKET_NAME=${SUPABASE_BUCKET_NAME}
            BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
            EXECUTION_URL=${EXECUTION_URL}
            EXECUTION_API_KEY=${EXECUTION_API_KEY}
            ONEDRIVE_CLIENT_ID=${ONEDRIVE_CLIENT_ID}
            ONEDRIVE_CLIENT_SECRET=${ONEDRIVE_CLIENT_SECRET}
            ONEDRIVE_REDIRECT_URI=${ONEDRIVE_REDIRECT_URI}
            EOF

            echo "Creating frontend .env file"
            cat > frontend/.env << EOF
            NEXT_PUBLIC_MS_CLIENT_ID=${NEXT_PUBLIC_MS_CLIENT_ID}
            EOF

            echo "Current branch: $(git branch --show-current)"

            echo "Fetching latest changes"
            git fetch origin

            echo "Stashing any local changes"
            git stash

            echo "Switching to branch: $BRANCH"
            git checkout $BRANCH

            echo "Resetting to match remote exactly"
            git fetch origin $BRANCH
            git reset --hard origin/$BRANCH
            git pull origin $BRANCH

            echo "Latest commit: $(git log -1 --oneline)"

            echo "Stopping backend to free memory for frontend build"
            docker-compose stop api

            echo "Deploying Frontend"

            cd ~/Full-SMS/frontend

            echo "Installing dependencies"
            npm ci --production=false

            echo "Building frontend"
            npm run build

            echo "Restarting frontend"
            pm2 restart frontend || pm2 start npm --name "frontend" -- start

            echo "let's take a moment to breathe and appreciate the fact that we have reached thus far loll,, I reckon 10 seconds yeah?"
            sleep 10
            echo "Frontend status:"
            pm2 status

            echo "deploying Backend"
            cd ~/Full-SMS

            docker rm -f full-sms_api_1 2>/dev/null || true
            docker-compose up -d --build api

            echo "Waiting for backend to start"
            sleep 15

            echo "Backend container status:"
            docker-compose ps

            echo "Running Health Checks"

            echo "Cheking backend"
            for i in 1 2 3 4 5; do
              if curl -f http://localhost:8000/api/py/health > /dev/null 2>&1; then
                echo "Backend is healthy"
                break
              fi
              if [ $i -eq 5 ]; then
                echo "Backend health check failed"
                docker-compose logs api --tail 50
                exit 1
              fi
              echo "Retrying in 5 seconds..."
              sleep 5
            done

            echo "checking frontend"
            if curl -f http://localhost:3000/ > /dev/null 2>&1; then
              echo "Frontend is healthy"
            else
              echo "Frontend health check failed"
              pm2 logs frontend --lines 50
              exit 1
            fi

            echo "checking plugin execution"
            PLUGIN_HEALTHY=$(curl -sf http://localhost:8001/health > /dev/null 2>&1 && echo "yes" || echo "no")
            if [ "$PLUGIN_HEALTHY" = "yes" ]; then
              echo "Plugin execution is healthy"
            else
              echo "Plugin execution not running, attempting restart"
              cd ~/plugin-execution
              export EXECUTION_API_KEY="${{ secrets.EXECUTION_API_KEY }}"
              nohup python3 execution_api.py > execution_api.log 2>&1 &
              sleep 5
              PLUGIN_RESTART=$(curl -sf http://localhost:8001/health > /dev/null 2>&1 && echo "yes" || echo "no")
              if [ "$PLUGIN_RESTART" = "yes" ]; then
                echo "Plugin execution restarted successfully"
              else
                echo "Plugin execution failed to start"
                cat execution_api.log 2>/dev/null || echo "No log file found"
                exit 1
              fi
            fi

            echo "Deployment completed successfully"
            echo "Frontend: https://fullsms.duckdns.org"
            echo "Backend: https://fullsms.duckdns.org/api/py"

      - name: Deployment Success Notification
        if: success()
        run: |
          echo "Deployment to Lightsail succeeded"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      - name: Deployment Failure Notification
        if: failure()
        run: |
          echo "Deployment to Lightsail failed"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
