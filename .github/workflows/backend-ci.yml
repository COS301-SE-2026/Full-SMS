name: Backend CI
#Updated to include Codecov coverage reporting
on:
    push:
      branches: [ develop, main, chore/github-actions-ci-cd, chore/codecov-setup, chore/backend-ci-update ]
      paths:
        - 'api/**'
        - '.github/workflows/backend-ci.yml'
    pull_request:
      branches: [ develop, main, chore/github-actions-ci-cd, chore/codecov-setup ]
      paths:
        - 'api/**'
        - '.github/workflows/backend-ci.yml'

jobs:
    lint-and-test:
      runs-on: ubuntu-latest
      env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_KEY: "placeholder-key"
          SUPABASE_SERVICE_KEY: "placeholder-service-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-key"
          SUPABASE_JWT_SECRET_KEY: "placeholder-jwt-secret"
          SUPABASE_JWK: '{"keys": []}'
          SUPABASE_BUCKET_NAME: "test-bucket"
          BACKEND_CORS_ORIGINS: "http://localhost:3000"
          CELERY_BROKER_URL: "redis://localhost:6379/0"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/0"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          REDIS_DB: "0"
          EXECUTION_URL: "http://localhost:8000"
          EXECUTION_API_KEY: "test-api-key"

      steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 api --exclude api/legacy --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 api --exclude api/legacy --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests with pytest
        run: |
          pytest api/tests/ -v --cov=api --cov-report=term-missing 

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          fail_ci_if_error: false
          
